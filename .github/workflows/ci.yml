on: [push, pull_request]
name: CI

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        name: [production, debug]
        include:
          - name: production
            config: production
          - name: debug
            config: debug

    name: linux:${{ matrix.name }}
    runs-on: ubuntu-22.04

    steps:
      - name: Install Packages
        run: |
          sudo apt-get update
          sudo apt-get install -y libgmp-dev libgtest-dev python-is-python3

      - uses: actions/checkout@v4

      - name: Restore Dependencies
        id: restore-deps
        uses: actions/cache@v4
        with:
          path: deps/install
          key: linux-deps-${{ hashFiles('contrib/setup-*') }}-${{ hashFiles('.github/workflows/ci.yml') }}

      - name: Setup Dependencies
        if: steps.restore-deps.outputs.cache-hit != 'true'
        run: |
          ./contrib/setup-btor2tools.sh
          ./contrib/setup-cadical.sh
          ./contrib/setup-symfpu.sh

      - name: Configure
        run: ./configure.sh ${{ matrix.config }} --testing --only-cadical

      - name: Build
        run: make -j4
        working-directory: build

      - name: Run CTest
        run: ctest -j4 --output-on-failure
        working-directory: build
